[project]
name = "scrapy-jev"
version = "0.1.0"
description = "Scrapy pipeline that uses Jev (TypeSafe AI) to spot-check scraped fields and stop a crawl when extraction quality drops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "itemadapter>=0.8",
    "requests>=2.31",
    "scrapy>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapy_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]